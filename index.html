<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Disk Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F3EF;--surface:#FFFFFF;
  --border:#E2DDD6;--border-focus:#BFBAB2;
  --text:#1A1916;--muted:#9C9890;--muted2:#C8C4BC;
  --disk-color:#2D6A4F;--disk-bg:#EAF4EE;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.page{display:flex;flex-direction:column;align-items:center;padding-top:120px;padding-bottom:80px;min-height:100vh}
.heading{font-family:'DM Serif Display',serif;font-size:40px;font-weight:400;color:var(--text);letter-spacing:-.02em;margin-bottom:36px;text-align:center;animation:fadeDown 500ms var(--ease-out) both}
.heading em{font-style:italic;color:var(--muted)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.search-container{width:100%;max-width:580px;padding:0 24px;position:relative;animation:fadeUp 500ms var(--ease-out) 80ms both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.search-box{width:100%;display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 20px;gap:10px;transition:border-color 200ms var(--ease-out),box-shadow 200ms var(--ease-out)}
.search-box:focus-within{border-color:var(--border-focus);box-shadow:0 2px 20px rgba(0,0,0,0.09)}
.search-icon{color:var(--muted);flex-shrink:0;transition:color 200ms var(--ease-out)}
.search-box:focus-within .search-icon{color:var(--text)}
#search{flex:1;border:none;outline:none;background:transparent;font-size:16px;font-family:'DM Sans',sans-serif;font-weight:400;color:var(--text);padding:15px 0;caret-color:var(--text)}
#search::placeholder{color:var(--muted2)}
.clear-btn{background:none;border:none;cursor:pointer;color:var(--muted2);padding:4px;display:flex;align-items:center;justify-content:center;border-radius:50%;opacity:0;transform:scale(0.7);transition:opacity 150ms var(--ease-out),transform 150ms var(--ease-out),color 150ms var(--ease-out);pointer-events:none}
.clear-btn.visible{opacity:1;transform:scale(1);pointer-events:all}
@media(hover:hover) and (pointer:fine){.clear-btn:hover{color:var(--text)}}
.search-hint{text-align:center;font-size:13px;color:var(--muted2);margin-top:14px;animation:fadeUp 500ms var(--ease-out) 160ms both}
.results{width:100%;max-width:580px;padding:0 24px;margin-top:12px}
.result-item{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 20px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:16px;opacity:0;transform:translateY(8px);animation:resultIn 320ms var(--ease-out) both}
@keyframes resultIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.result-name{font-size:15px;font-weight:400;color:var(--text);line-height:1.3;flex:1;min-width:0}
.result-name strong{font-weight:500}
.result-item{align-items:flex-start}
.result-main{flex:1;min-width:0}
.result-exports{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.exp-chip{font-size:11px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-more{font-size:11px;color:var(--muted);padding:2px 4px}
.result-noexp{font-size:12px;color:var(--muted2);font-style:italic;margin-top:6px}
.result-right{align-items:flex-end;padding-top:2px}
.result-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.disk-pill{font-size:12px;font-weight:500;color:var(--disk-color);background:var(--disk-bg);border-radius:999px;padding:3px 11px;white-space:nowrap}
.result-date{font-size:11px;color:var(--muted);white-space:nowrap}
.no-results{text-align:center;padding:40px 20px;opacity:0;animation:resultIn 280ms var(--ease-out) both}
.no-results-t{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;font-style:italic;color:var(--muted);margin-bottom:6px}
.no-results-s{font-size:13px;color:var(--muted2)}
.status{text-align:center;font-size:12px;color:var(--muted2);margin-top:18px;font-family:'DM Sans',sans-serif}
.status a{color:var(--disk-color);text-decoration:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="page">
  <h1 class="heading">Find your project. <em>Instantly.</em></h1>
  <div class="search-container">
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Project name or disk..." autocomplete="off" spellcheck="false" aria-label="Search projects" disabled />
      <button class="clear-btn" id="clear-btn" onclick="clearSearch()" aria-label="Clear search">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="search-hint" id="hint">Loading projects from Google Sheets...</div>
  <div class="results" id="results"></div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRiTV9z2S8NCj6V3UnPEENaNMbFg4MTrEse5WIbIEBvaXaLgqLiPsaC_ZU49k2_3HvTz_EgdyTi1hDF/pub?output=csv";

let db = [];

const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function fmtD(d){
  if(!d) return '';
  const parsed = new Date(d);
  if(isNaN(parsed)) return d;
  return parsed.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

// Minimal CSV parser that handles quoted fields
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"' && text[i+1] === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

async function loadData(){
  try {
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const rows = parseCSV(text);
    // Row 0 is the header. Columns: Project, Disk, Disk Location, Full Path, Editor, Date, Time, Status, Notes
    db = rows.slice(1)
      .filter(r => r[0] && r[0].trim())
      .map(r => ({
        project: r[0] || '',
        exports: r[1] || '',
        disk: r[2] || '',
        lastSeen: r[3] || '',
      }));
    document.getElementById('search').disabled = false;
    document.getElementById('hint').textContent = `${db.length} projects tracked across all drives`;
  } catch(e) {
    document.getElementById('hint').textContent = 'Could not load data. Check your connection and refresh.';
    console.error(e);
  }
}

function highlight(text,q){
  if(!q) return esc(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx===-1) return esc(text);
  return esc(text.slice(0,idx))+'<strong>'+esc(text.slice(idx,idx+q.length))+'</strong>'+esc(text.slice(idx+q.length));
}

function exportsHtml(str){
  const files = str.split(',').map(s=>s.trim()).filter(Boolean);
  if(!files.length) return '';
  const shown = files.slice(0,4).map(f=>`<span class="exp-chip">${esc(f)}</span>`).join('');
  const more = files.length>4 ? `<span class="exp-more">+${files.length-4} more</span>` : '';
  return shown+more;
}

function doSearch(){
  const q = document.getElementById('search').value.trim();
  const res = document.getElementById('results');
  const hint = document.getElementById('hint');
  document.getElementById('clear-btn').classList.toggle('visible', q.length>0);
  if(!q){ res.innerHTML=''; hint.style.display='block'; return; }
  hint.style.display='none';
  const m = db.filter(r => (r.project+' '+r.disk+' '+r.exports).toLowerCase().includes(q.toLowerCase()));
  if(!m.length){
    res.innerHTML = `<div class="no-results"><div class="no-results-t">Nothing found for "${esc(q)}"</div><div class="no-results-s">Try a different name or check the spelling</div></div>`;
    return;
  }
  res.innerHTML = m.map((r,i)=>`
    <div class="result-item" style="animation-delay:${i*55}ms">
      <div class="result-main">
        <div class="result-name">${highlight(r.project,q)}</div>
        ${r.exports ? `<div class="result-exports">${exportsHtml(r.exports)}</div>` : '<div class="result-exports result-noexp">No exports yet</div>'}
      </div>
      <div class="result-right">
        <span class="disk-pill">${esc(r.disk)}</span>
        ${r.lastSeen ? `<span class="result-date">Last seen ${esc(r.lastSeen)}</span>` : ''}
      </div>
    </div>`).join('');
}

function clearSearch(){
  document.getElementById('search').value='';
  document.getElementById('search').focus();
  doSearch();
}

document.getElementById('search').addEventListener('input', doSearch);
document.getElementById('search').addEventListener('keydown', e=>{ if(e.key==='Escape') clearSearch(); });

loadData();
</script>
</body>
</html>
